<svg xmlns="http://www.w3.org/2000/svg" width="520" height="224" viewBox="0 0 520 224" role="img" aria-labelledby="title desc">
<title id="title">Qazi Farhan Ahmad - Developer Journey Timeline</title>
<desc id="desc">Animated journey log: 2022 foundation, 2023 MERN core, 2024 AI expansion, now production-grade systems.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020617"/><stop offset="1" stop-color="#11152F"/></linearGradient>
  <linearGradient id="border" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C3AED"/><stop offset="0.48" stop-color="#22D3EE"/><stop offset="1" stop-color="#10B981"/></linearGradient>
  <linearGradient id="progress" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#10B981"/></linearGradient>
  <style>
    .panel-title { font-family: 'Courier New', Consolas, monospace; font-size: 11px; letter-spacing: 2px; fill: #38BDF8; opacity: 0.85; }
    .term { font-family: 'Courier New', Consolas, monospace; font-size: 10px; letter-spacing: 1px; fill: #F87171; }
    .badge { font-family: 'Courier New', Consolas, monospace; font-size: 12px; font-weight: 700; fill: #E2E8F0; }
    .label { font-family: 'Courier New', Consolas, monospace; font-size: 13px; font-weight: 700; }
    .sub { font-family: 'Courier New', Consolas, monospace; font-size: 11px; fill: #94A3B8; }
  </style>
</defs>
<rect width="520" height="224" rx="16" fill="url(#bg)"/>
<rect x="0.75" y="0.75" width="518.5" height="222.5" rx="15.25" fill="none" stroke="url(#border)" stroke-opacity="0.5"/>
<rect x="12" y="12" width="496" height="30" rx="15" fill="#07111F" fill-opacity="0.84"/>
<circle cx="27" cy="27" r="4.5" fill="#EF4444"/>
<circle cx="43" cy="27" r="4.5" fill="#F59E0B"/>
<circle cx="59" cy="27" r="4.5" fill="#10B981"/>
<text x="262" y="31" text-anchor="middle" class="panel-title">BUILD.PATH / MILESTONE.LOG</text>
<circle cx="484" cy="27" r="3" fill="#F87171"><animate attributeName="opacity" values="1;0.15;1" dur="1.1s" repeatCount="indefinite"/></circle>
<text x="491" y="30.5" class="term">LIVE</text>

<line x1="95" y1="62" x2="95" y2="196" stroke="#1E3A5F" stroke-width="2"/>
<line x1="95" y1="62" x2="95" y2="196" stroke="#22D3EE" stroke-width="2" stroke-opacity="0.55" stroke-dasharray="3 9"><animate attributeName="stroke-dashoffset" values="0;-24" dur="2s" repeatCount="indefinite"/></line>
<rect x="93.5" y="62" width="3" height="134" fill="url(#progress)" opacity="0.9"><animate attributeName="height" from="0" to="134" dur="2.6s" begin="0.6s" fill="freeze"/></rect>

<rect x="18" y="51" width="58" height="22" rx="6" fill="#334155" fill-opacity="0.55"/>
<text x="47" y="66" text-anchor="middle" class="badge">2022</text>
<circle cx="95" cy="62" r="5.5" fill="#0B1220" stroke="#64748B" stroke-width="2.5"/>
<text x="116" y="66" class="label" fill="#94A3B8">FOUNDATION</text>
<text x="116" y="82" class="sub">HTML · CSS · JavaScript</text>

<rect x="18" y="96" width="58" height="22" rx="6" fill="#065F46" fill-opacity="0.5"/>
<text x="47" y="111" text-anchor="middle" class="badge">2023</text>
<circle cx="95" cy="107" r="5.5" fill="#0B1220" stroke="#10B981" stroke-width="2.5"/>
<text x="116" y="111" class="label" fill="#4ADE80">MERN CORE</text>
<text x="116" y="127" class="sub">React · Node.js · MongoDB</text>

<rect x="18" y="141" width="58" height="22" rx="6" fill="#5B21B6" fill-opacity="0.45"/>
<text x="47" y="156" text-anchor="middle" class="badge">2024</text>
<circle cx="95" cy="152" r="5.5" fill="#0B1220" stroke="#7C3AED" stroke-width="2.5"/>
<text x="116" y="156" class="label" fill="#A78BFA">AI EXPANSION</text>
<text x="116" y="172" class="sub">RAG · Groq · Gemini · OpenAI</text>

<rect x="18" y="186" width="58" height="22" rx="6" fill="#155E75" fill-opacity="0.5"/>
<text x="47" y="201" text-anchor="middle" class="badge">NOW</text>
<circle cx="95" cy="197" r="6" fill="#0B1220" stroke="#22D3EE" stroke-width="2.5"><animate attributeName="r" values="6;8;6" dur="2.4s" repeatCount="indefinite"/></circle>
<text x="116" y="201" class="label" fill="#22D3EE">PRODUCTION</text>
<text x="116" y="217" class="sub">SaaS · Security-first systems</text>
</svg>
