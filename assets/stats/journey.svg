<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" role="img" aria-labelledby="title desc">
<title id="title">Qazi Farhan Ahmad - Developer Journey Timeline</title>
<desc id="desc">Journey log panel: 2023 MERN core, 2024 AI stack, now production-grade systems.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020617"/><stop offset="1" stop-color="#11152F"/></linearGradient>
  <linearGradient id="border" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C3AED"/><stop offset="0.48" stop-color="#22D3EE"/><stop offset="1" stop-color="#10B981"/></linearGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.3"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></linearGradient>
  <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#22D3EE" opacity="0.052"/></pattern>
  <clipPath id="line-0"><rect x="36" y="64" width="0" height="24"><animate attributeName="width" from="0" to="460" dur="0.36s" begin="0.5s" fill="freeze"/></rect></clipPath>
  <clipPath id="line-1"><rect x="36" y="112" width="0" height="24"><animate attributeName="width" from="0" to="460" dur="0.36s" begin="0.68s" fill="freeze"/></rect></clipPath>
  <clipPath id="line-2"><rect x="36" y="160" width="0" height="24"><animate attributeName="width" from="0" to="460" dur="0.36s" begin="0.79s" fill="freeze"/></rect></clipPath>
  <clipPath id="line-3"><rect x="36" y="208" width="0" height="24"><animate attributeName="width" from="0" to="460" dur="0.36s" begin="0.89s" fill="freeze"/></rect></clipPath>
  <style>
    .terminal-label { font-family: 'Courier New', Consolas, monospace; font-size: 13px; letter-spacing: 0.5px; fill: #64748B; }
    .live-label { font-family: 'Courier New', Consolas, monospace; font-size: 11px; letter-spacing: 1px; fill: #F87171; }
    .section { font-family: 'Courier New', Consolas, monospace; font-size: 16px; font-weight: 700; fill: #10B981; }
    .row { font-family: 'Courier New', Consolas, monospace; font-size: 15px; }
    .key { font-weight: 700; }
    .footer { font-family: 'Courier New', Consolas, monospace; font-size: 15px; fill: #38BDF8; }
  </style>
</defs>
<rect width="520" height="300" rx="16" fill="url(#background)"/>
<rect width="520" height="300" rx="16" fill="url(#scanlines)"/>
<rect x="3" y="3" width="514" height="294" rx="16" fill="none" stroke="url(#border)" stroke-width="2" opacity="0.76"><animate attributeName="opacity" values="0.5;0.94;0.5" dur="3.4s" repeatCount="indefinite"/></rect>
<rect x="12" y="12" width="496" height="34" rx="17" fill="#07111F" fill-opacity="0.84"/>
<circle cx="25" cy="29" r="5" fill="#EF4444"/><circle cx="44" cy="29" r="5" fill="#F59E0B"/><circle cx="63" cy="29" r="5" fill="#10B981"/>
<text x="260" y="36" text-anchor="middle" class="terminal-label">Qaziaaaa@journey ~ % ./timeline --live</text>
<circle cx="478" cy="29" r="4" fill="#F87171"><animate attributeName="opacity" values="1;0.15;1" dur="1.1s" repeatCount="indefinite"/></circle><text x="487" y="33" class="live-label">LIVE</text>
<rect x="12" y="56" width="496" height="232" rx="12" fill="#07111F" fill-opacity="0.42" stroke="url(#border)" stroke-opacity="0.42"/>

<g clip-path="url(#line-0)"><text x="36" y="84" class="section">- TIMELINE ------------------------------------------</text></g>
<g clip-path="url(#line-1)"><text x="36" y="132" class="row"><tspan fill="#64748B">. </tspan><tspan class="key" fill="#22D3EE">2023</tspan><tspan fill="#64748B">: ...... </tspan><tspan fill="#E5E7EB">MERN Core — React · Node.js · MongoDB</tspan></text></g>
<g clip-path="url(#line-2)"><text x="36" y="180" class="row"><tspan fill="#64748B">. </tspan><tspan class="key" fill="#22D3EE">2024</tspan><tspan fill="#64748B">: ...... </tspan><tspan fill="#E5E7EB">AI Stack — RAG · Groq · Gemini · OpenAI</tspan></text></g>
<g clip-path="url(#line-3)"><text x="36" y="228" class="row"><tspan fill="#64748B">. </tspan><tspan class="key" fill="#22D3EE">NOW</tspan><tspan fill="#64748B">: ....... </tspan><tspan fill="#E5E7EB">Production — SaaS · Security-first</tspan></text></g>
<text x="36" y="266" class="footer">signal.locked &gt; FOUNDATION / MERN / AI / PRODUCTION</text>
<rect x="448" y="258" width="10" height="18" fill="#22D3EE" opacity="0"><animate attributeName="opacity" values="0;0;1;0;1;0;1;0" keyTimes="0;0.03;0.06;0.32;0.5;0.68;0.84;1" dur="1.4s" begin="1.3s" repeatCount="indefinite"/></rect>
<rect x="0" y="-70" width="520" height="70" fill="url(#scan)" opacity="0.72" style="mix-blend-mode:screen"><animateTransform attributeName="transform" type="translate" from="0 -70" to="0 380" dur="4.5s" repeatCount="indefinite"/></rect>
</svg>
