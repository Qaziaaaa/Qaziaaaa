    .live-label { font-family: 'Courier New', Consolas, monospace; font-size: 11px; letter-spacing: 1px; fill: #F87171; }
    .section { font-family: 'Courier New', Consolas, monospace; font-size: 16px; font-weight: 700; fill: #10B981; }
    .row { font-family: 'Courier New', Consolas, monospace; font-size: 15px; }
