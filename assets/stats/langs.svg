    .center-sub { font-family: 'Courier New', Consolas, monospace; font-size: 10px; letter-spacing: 1px; fill: #64748B; }
    .footer { font-family: 'Courier New', Consolas, monospace; font-size: 15px; fill: #38BDF8; }
  </style>
