<svg xmlns="http://www.w3.org/2000/svg" width="520" height="224" viewBox="0 0 520 224" role="img" aria-labelledby="title desc">
<title id="title">Qazi Farhan Ahmad - Top Languages Donut</title>
<desc id="desc">Top languages panel: TypeScript, JavaScript, HTML, CSS and more with an animated donut chart.</desc>
<defs>
